blurb: >-
  Haribhadra's compact manual of the Jaina way of life, in eight adhyāyas of
  terse sūtras. It moves from the general duties of a householder to the
  special vows, the fitness for and discipline of ascetic life, and the
  fruits of dharma up to liberation. It is read here with the full vṛtti of
  Municandrasūri.
about:
  - "Haribhadra opens with a verse promising a <em>bindu</em>, a drop drawn from the ocean of scripture, and defines <em>dharma</em> as conduct that follows the uncontradicted word of the Jina and is joined with <em>maitrī</em> and the other three attitudes. He then divides it into the dharma of the householder and that of the ascetic. Adhyāyas 1–3 treat householder dharma in its general and special forms, including the <em>aṇuvratas</em>, <em>guṇavratas</em> and <em>śikṣāpadas</em> with their transgressions. Adhyāyas 4–6 treat renunciation and the life of the ascetic, and adhyāyas 7–8 the fruit of dharma."
  - "Municandrasūri's vṛtti opens each sūtra with a short lead-in, which the reader shows above the sūtra's commentary. It then glosses the sūtra word by word and supports it with verses cited from Jaina and Brahmanical sources."
  - "Suali's Bibliotheca Indica edition was begun in 1908, stalled after 1921, and completed by Chintaharan Chakravarti in 1940. It counts the opening and closing verses of each adhyāya as sūtras and prints the closing <em>iti</em> apart from the sūtra, unlike the 1924 Ahmedabad edition. Where the printed sūtra number in this text is a slip, the reader numbers the sūtras in sequence and notes the printed number."
