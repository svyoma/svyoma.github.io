blurb: >-
  Jinasena's life of Pārśvanātha, the 23rd Tīrthaṅkara, woven around Kālidāsa's
  Meghadūta. Every one of the Meghadūta's lines is taken up as a samasyā and
  completed into a new verse, so the demon Śambara's assault on the meditating
  Pārśva is told in the cadence of the yakṣa's message to the cloud. The poem
  has four sargas and 364 verses, almost all in mandākrāntā.
about:
  - "Jinasena uses the samasyāpūraṇa technique throughout. He takes a line of the <em>Meghadūta</em> unchanged and composes the rest of the verse around it. Usually the borrowed line is the fourth, but it can be the first, second or third, and in 117 verses two lines are taken. Across 358 verses all 480 lines of Kālidāsa's 120 verses are used. The last six verses of sarga 4 are Jinasena's own conclusion, in other metres."
  - "Because a samasyā must keep the borrowed line intact, scholars since K. B. Pathak have used the <em>Pārśvābhyudaya</em> as a witness to the <em>Meghadūta</em> as it was read in the ninth century. The reader marks each borrowed line in the verse and rebuilds the <em>Meghadūta</em> from them in the order Jinasena uses them."
  - "The colophons call each of the four sargas <em>bhagavatkaivalyavarṇana</em>, and the source notes that it is unclear why they all share this name."
