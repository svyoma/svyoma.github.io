blurb: >-
  A fifteenth-century Jaina answer to Kālidāsa's Kumārasambhava. Where Kālidāsa
  tells of the birth of Kumāra (Kārttikeya), Jayaśekharasūri tells of the birth
  of Bharata, son of Ṛṣabhadeva. On the way the poem describes Ayodhyā,
  Ṛṣabha's birth and youth, his marriage to Sumaṅgalā and Sunandā, the fourteen
  dreams, the seasons and the dawn. It runs to eleven sargas and is printed with
  the ṭīkā of the poet's pupil Dharmaśekharasūri.
about:
  - "According to the commentator, Sarasvatī appeared to Jayaśekharasūri while he sat in meditation at Stambhatīrtha (Khambhat). She gave him the two opening verses, <em>astyuttarasyāṃ diśi kośaleti</em> and <em>sampannakāmā nayanābhirāmāḥ</em>, and asked him to compose the rest. The poet calls himself <em>vāṇīdattavaraḥ</em> in the last verse of the final sarga."
  - "Dharmaśekharasūri's ṭīkā is deliberately simple. It opens each verse with a <em>pratīka</em>, restores prose word order, glosses words with synonyms and names figures of speech such as <em>utprekṣā</em> and <em>virodha</em>. It also cites Hemacandra's <em>Siddhahema</em> for grammatical points."
  - "The 1946 edition was begun by Ācārya Vijayakṣamābhadrasūri, who died after eight sargas had been printed. Muni Vikramavijaya completed it from sarga 9 onward using the same press copy."
