blurb: >-
  Hemacandra's manual of poetics in eight adhyāyas of sūtras, with his own two
  commentaries. The Alaṅkāracūḍāmaṇi explains each sūtra and gives its example.
  The Viveka argues the finer points with a wealth of citations from earlier
  poetics, especially Ānandavardhana, Abhinavagupta and Mammaṭa. Together they
  cover the purpose and cause of poetry, word and meaning, rasa, faults and
  excellences, the figures of sound and sense, the characters of literature,
  and the kinds of composition.
about:
  - "Hemacandra wrote the <em>Kāvyānuśāsana</em> as one of the treatises that fill out his <em>Siddhahemaśabdānuśāsana</em>, alongside the <em>Chandonuśāsana</em> on prosody. It works as a compendium: the sūtras are brief, and the two commentaries hold most of the matter. They quote hundreds of verses from Sanskrit and Prākṛta literature as examples, so the work is also an anthology."
  - "In the reader, each sūtra keeps the edition's number within its adhyāya. The commentary panel gives the <em>Alaṅkāracūḍāmaṇi</em> first and folds the <em>Viveka</em> beneath it. Numbered examples keep their numbers, and each Prākṛta verse shows its Sanskrit chāyā. Glosses from the anonymous palm-leaf <em>ṭippaṇa</em> are listed under the passage they explain, and small markers give the page of the printed edition."
