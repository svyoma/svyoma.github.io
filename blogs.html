        body {
            font-family: 'Junicode', Georgia, serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            background-image: var(--paper-texture);
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 30px 0;
            background-color: var(--secondary-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            background-image: var(--paper-texture);
            border-bottom: 3px solid var(--accent-color);
        }

        header .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        header h1 {
            font-family: 'Adishila', Georgia, serif;
            margin: 0;
            color: var(--primary-color);
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
        }

        header h1:hover {
            transform: scale(1.05);
        }

        header p {
            font-style: italic;
            margin: 10px 0 20px;
            color: #5a5a5a;
            font-size: 1.1rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav ul li {
            margin: 5px 10px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: var(--primary-color);
            transition: all 0.3s ease;
        }

        nav ul li a:hover::after {
            width: 100%;
            left: 0;
        }

        main {
            padding: 40px 0;
        }

        .blog-section {
            margin-bottom: 60px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            color: var(--primary-color);
            font-size: 2rem;
            position: relative;
            margin-bottom: 40px;
            display: inline-block;
            font-family: 'Adishila', Georgia, serif;
        }

        .section-title::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 3px;
            background-color: var(--accent-color);
            bottom: -10px;
            left: 0;
            transition: width 0.5s ease;
        }

        .section-title:hover::after {
            width: 100%;
        }

        .blog-card {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 167, 106, 0.2);
            background-image: var(--paper-texture);
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
        }

        .blog-image {
            flex: 0 0 250px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .blog-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .blog-card:hover .blog-image img {
            transform: scale(1.05);
        }

        .blog-content {
            flex: 1;
        }

        .blog-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .blog-meta i {
            color: var(--accent-color);
        }

        .blog-title {
            font-family: 'Adishila', Georgia, serif;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .blog-title:hover {
            color: var(--primary-color);
            opacity: 0.8;
        }

        .blog-excerpt {
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            gap: 5px;
        }

        .read-more:hover {
            color: var(--primary-color);
            transform: translateX(5px);
        }

        .vintage-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--accent-color);
            opacity: 0.6;
        }

        .vintage-corner.top-left {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }

        .vintage-corner.top-right {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
        }

        .vintage-corner.bottom-left {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
        }

        .vintage-corner.bottom-right {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
        }

        .blog-categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .category-tag {
            background-color: var(--secondary-color);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .category-tag:hover {
            background-color: var(--accent-color);
            color: white;
        }

        footer {
            background-color: var(--secondary-color);
            padding: 30px 0;
            text-align: center;
            border-top: 3px solid var(--accent-color);
            position: relative;
            background-image: var(--paper-texture);
        }

        footer p {
            color: var(--primary-color);
            margin-top: 20px;
        }

        /* Mobile Responsiveness */
        @media screen and (max-width: 767px) {
            header h1 {
                font-size: 2rem;
            }
            
            header p {
                font-size: 1rem;
            }
            
            .section-title {
                font-size: 1.7rem;
            }
            
            .blog-title {
                font-size: 1.3rem;
            }
            
            .blog-card {
                flex-direction: column;
                gap: 20px;
            }
            
            .blog-image {
                flex: 0 0 auto;
            }
            
            .blog-meta {
                flex-wrap: wrap;
            }
        }

        /* --- dynamic index: search + tag filter (rendered by blog.js) --- */
        .blog-controls {
            display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 18px;
        }
        .blog-search {
            flex: 1 1 240px; max-width: 360px; font-family: inherit; font-size: 0.95rem;
            padding: 8px 14px; border: 1px solid rgba(212,167,106,0.5); border-radius: 20px;
            background: #fff; color: var(--primary-color);
        }
        .blog-search:focus { outline: none; border-color: var(--accent-color); }
        .blog-count { font-size: 0.85rem; color: #666; }
        .blog-rss {
            margin-left: auto; font-size: 0.85rem; color: var(--link-color); text-decoration: none;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .blog-rss:hover { color: var(--accent-color); }
        .blog-filter { margin-bottom: 30px; }
        .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
        .filter-label {
            font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: #999;
            min-width: 52px;
        }
        .series-chip { border-style: dashed; }
        .series-chip.active { background: var(--primary-color); border-color: var(--primary-color); color: #fff; }
        .blog-series { margin-bottom: 10px; }
        .series-badge {
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
            color: var(--primary-color); border: 1px dashed rgba(122,31,43,0.4);
            border-radius: 12px; padding: 3px 10px; background: rgba(122,31,43,0.04);
        }
        .series-badge:hover { background: var(--primary-color); color: #fff; }
        .filter-chip {
            font-family: inherit; font-size: 0.82rem; cursor: pointer;
            background: var(--secondary-color); color: var(--primary-color);
            border: 1px solid rgba(212,167,106,0.35); border-radius: 15px; padding: 4px 12px;
            transition: all 0.2s ease;
        }
        .filter-chip:hover { background: var(--accent-color); color: #fff; }
        .filter-chip.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .filter-chip .chip-n { opacity: 0.6; font-size: 0.72em; }
        .blog-categories .category-tag { cursor: pointer; }
        .blog-empty, .blog-error { color: #666; padding: 30px 0; }
